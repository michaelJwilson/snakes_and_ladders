[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "phylo"
# Single source of truth for the version is Cargo.toml's [package].version;
# maturin reads it from there when `dynamic = ["version"]` is set, so the
# two files can't silently drift out of sync.
dynamic = ["version"]
description = ""
authors = [{ name = "M. J. Wilson" }]
license = "MIT"
requires-python = ">=3.12.2"
readme = "README.md"
# phylo.sim imports numpy (simulation) and pyyaml (simulation_params.yaml
# loading) directly; phylo.qa imports matplotlib to render the figures
# docs/tex/ includes; phylo.likelihood.pruning_torch imports torch, the
# autodiff backend CLAUDE.md's Performance section already decided on --
# added here, by the first PR whose code imports it, per that section's
# note. All four are core dependencies rather than front-loaded ahead of
# need (see CLAUDE.md, "keep dependencies minimal"). matplotlib has 21k+
# GitHub stars and torch 90k+, both well above the 1,000-star review bar.
# Add further entries only as real code depends on them.
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.3",
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.9,<0.10",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "pip-audit>=2.7",
    # 919 GitHub stars as of 2026-09-02, below DEV.md's 1,000-star bar --
    # flagged per CLAUDE.md/DEV.md dependency rules; see PR description.
    "towncrier>=24.8.0",
    "types-PyYAML>=6.0",
]
docs = [
    "sphinx>=7,<9",
]
# Executing the committed notebooks, so their numbers cannot rot (issue
# #203). Deliberately its own extra rather than part of `test`: a normal
# `pip install .` and the per-pull-request suite do not need a kernel, and
# `infra/check_notebooks.py` is the only consumer.
notebooks = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]
test = [
    # >=9.0.3 is the fix for PYSEC-2026-1845; the previous <9 cap blocked it.
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4",
]

[project.scripts]
run_phylo = "phylo.scripts.run_phylo:main"

[tool.maturin]
python-source = "python"
module-name = "phylo.oxiphylo"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "G004", # f-string in logger
  "T201", # print statements
  "PLR2004", # magic value in assert
  "ANN",  # annotation presence is enforced by mypy --strict, not ruff
]
# NPY002 (legacy np.random calls) is deliberately NOT ignored: seeded
# `np.random.default_rng` is the reproducibility convention here.

extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "NPY",         # NumPy specific rules
  "PD",          # pandas-vet
]
extend-ignore = [
  "PLR09",    # Too many <...>
  "ISC001",   # Conflicts with formatter
]
unfixable = [
  "T20",  # Removes print statements
  "F841", # Removes unused variables
]

[tool.ruff.lint.per-file-ignores]
# Tests are linted like the rest of the repo -- scientific correctness lives
# here. Only rules that fight normal pytest style are relaxed.
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # literal expected values are the point of a regression test
]

[tool.mypy]
strict = true
# `infra/` is checked too: `select_tests.py` decides what CI runs, so a type
# error there is a test that silently did not run. `mypy_path` lets the test
# module import it the same way CI does.
files = ["python", "tests", "infra"]
mypy_path = "infra"

[[tool.mypy.overrides]]
# pytest-benchmark ships no py.typed marker.
module = "pytest_benchmark.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `nbformat` ships type information but leaves `read` and `write` untyped, so
# --strict rejects a correct call site. Narrowed to the one module that reads
# notebooks rather than relaxed globally.
module = "check_notebooks"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# The `lint` job syncs `--extra test`, not `--extra notebooks`, so these are
# absent where mypy runs and every import of them is `import-not-found`.
# Moving the imports into the functions that execute a notebook does not help:
# mypy resolves an import wherever it appears. They are optional dependencies
# of one developer script, so the type checker is told they may be missing
# rather than the job made to install a Jupyter kernel to type-check three
# lines. Where they *are* installed -- a developer environment, the
# `notebooks` job -- mypy still checks against the real thing.
module = ["nbformat.*", "nbclient.*"]
ignore_missing_imports = true

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "release: long-running scientific validity test, run on release rather than per PR (DEV.md CI & Performance Budget)",
    "stress: same claim at a size the 5-minute CI budget cannot hold; run with `-m stress` inside the 10-minute developer budget (DEV.md CI & Performance Budget)",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["phylo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
