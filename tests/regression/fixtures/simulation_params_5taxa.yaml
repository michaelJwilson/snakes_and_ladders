# Ground truth for the reward-surface comparison at a size the per-PR suite
# can afford (tests/regression/test_qa_rl_reward_surface.py). Every field is
# required -- see python/snakes_and_ladders/sim/params.py and python/snakes_and_ladders/sim/CLAUDE.md.
#
# 5 taxa because the fitted surface costs one optimization per topology: 15
# unrooted topologies here against 105 at 6 taxa, which is the difference
# between a few seconds and half a minute. The 6-taxon fixture runs the same
# comparison behind the release gate, where the extra resolution is worth
# paying for.
#
# The branch lengths are deliberately uneven, for the reason
# simulation_params_6taxa.yaml gives: a tree with equal branches has
# near-degenerate alternatives, and a comparison of two scoring surfaces run
# on one would measure the fixture's symmetry rather than the surfaces.
seed: 20260906
n_sites: 1200
tolerance: 0.01
k: 4
pi: [0.25, 0.25, 0.25, 0.25]
tau:
  name: root
  children:
    - name: A
      branch_length: 0.11
    - name: B
      branch_length: 0.26
    - name: ancestor_CDE
      branch_length: 0.07
      children:
        - name: C
          branch_length: 0.19
        - name: ancestor_DE
          branch_length: 0.12
          children:
            - name: D
              branch_length: 0.08
            - name: E
              branch_length: 0.31
