model: count-hmm-reference
oracle: none

# The count-pair HMM reference cell (issue #1390) at 8,000 positions, 400
# segments: NB total with per-position exposure, beta-binomial successes over
# per-position trials. Refereed by the generating parameters' log-likelihood
# (stress.baseline.json). Drawn level counts:
# 7660 / 100 / 120 / 40 / 0 / 20 / 20 / 40.
seed: 1390
n_positions: 8000
# The generating levels are declared, not derived (python/sal/sim/
# count_hmm_cell.py), and default to the downstream shape: K = 7 states
# fitted against 8 generating levels (the low end of its 8 to 16). One level
# holds 97%, two rare levels 1% each (the 1--2% band), and five trace levels
# 0.2% each; "~98% on one level" and "rare levels at 1--2%" cannot both hold
# exactly over 8 levels, and this is the reading taken. Pairs sharing a ladder
# rung differ in rate, pairs sharing a rate differ in rung: equal in one
# channel only, never both.
n_fit_states: 7
shares: [0.97, 0.01, 0.01, 0.002, 0.002, 0.002, 0.002, 0.002]
ladder: [0, -1, 1, 0, 0, -2, 2, 1]
rate: [0.5, 0.5, 0.5, 0.4, 0.6, 0.5, 0.3, 0.7]
dispersion: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
concentration: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
base_mean: 100.0
delta_log_mean: 0.3
# The dominant level stays with probability 1 - 1e-7, the downstream value;
# the chain is reversible with stationary law shares. At that stay a segment
# is one level almost surely, so segments of 20 are what put the rare levels
# in the data.
stay: 0.9999999
segment_length: 20
# Exposure log-normal(0, 0.2) per position; trials 1 + Poisson(39).
exposure_spread: 0.2
trials_mean: 40.0

observations_digest: a518a96d396fc3a6

# One factor at a time from this instance (issue #1390); built by
# CountHmmReferenceParams.variant.
variants:
  # the states a fit is given; the data do not move
  k3: {n_fit_states: 3}
  k12: {n_fit_states: 12}
  # the dominant level's share, the rest scaled
  dominant_50: {shares: [0.50, 0.20, 0.20, 0.02, 0.02, 0.02, 0.02, 0.02]}
  dominant_90: {shares: [0.90, 0.04, 0.04, 0.004, 0.004, 0.004, 0.004, 0.004]}
  delta_0.1: {delta_log_mean: 0.1}
  delta_0.6: {delta_log_mean: 0.6}
  stay_1e-8: {stay: 0.99999999}
  stay_1e-2: {stay: 0.99}
  # A downstream caller's instance as a whole, not one factor (issue #1412):
  # its count-pair HMM at the Baum-Welch call, read off five of its problems
  # (one 4-group instance and four drawn from its stream, 4-5 groups each),
  # nothing of them committed. Read: 8,324-10,496 positions in 88-110
  # segments of median length 84-118; K = 7 unphased states, the transition
  # held at stay 1 - 1e-7; exposure median 309-923, log-sd 1.0-1.9; trials
  # median 37-133, mean 92-179; fitted shared 1 / r 0.14-0.34 and shared
  # concentration 940-2,374; one level at 95.0-97.3% and 5-16 levels, loss
  # and gain levels at log depth ratio -0.82 to 0.96, allele rate 0.02-0.15
  # where one allele is lost. Not mirrored: trials are 1 + Poisson here and
  # over-dispersed there (log-sd 0.86-0.91), and segment lengths vary there.
  downstream:
    n_positions: 10240
    segment_length: 128
    shares: [0.96, 0.02, 0.01, 0.004, 0.002, 0.002, 0.001, 0.001]
    ladder: [0, 0, -2, 2, -2, 1, 3, 2]
    rate: [0.5, 0.03, 0.03, 0.05, 0.15, 0.33, 0.48, 0.65]
    dispersion: [4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0, 4.0]
    concentration: [1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0, 1000.0]
    base_mean: 450.0
    exposure_spread: 1.3
    trials_mean: 100.0
