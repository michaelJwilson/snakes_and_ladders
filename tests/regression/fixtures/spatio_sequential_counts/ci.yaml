model: spatio-sequential-counts
oracle: transfer-matrix

# The coupled model with two-channel count emissions, at the size every
# reference for the 5K instance is established at. Every field is required --
# see python/snakes_and_ladders/sim/count_pairs.py.
#
# 8x8 triangular = 64 vertices, M = K = 2, S = 1,000: 64,000 count pairs, and
# about 16,000 per (class, state), which is what the Rust simulator's per-state
# moments are compared against. The 64 vertices are also the slice of the 5K
# instance the Rust E step is pinned on, so the two comparisons are at one
# size.
#
# The stated oracle is the transfer matrix and not enumeration: given the
# labelling the classes decouple, and each class's evidence and state
# posterior are then the exact forward recursion over its chain, which shares
# no code with the Rust kernel it referees. An enumerable instance would need
# S small enough that no moment could be measured on it, which is the trade
# this file settles in favour of the moments.
seed: 20260908
shape: [8, 8]
boundary: open
coupling: 1.0
n_classes: 2
n_states: 2
n_positions: 1000
beta: 1.0
self_transition: 0.7
initial:
  - [0.6, 0.4]
  - [0.35, 0.65]

# One simulation, three instances: bin `factor` positions of the fine
# draw into one, in both channels. `marker` is the tier the full test at that
# factor runs in, measured rather than assumed (DEV.md, CI & Performance
# Budget). At this size all three fit the CI budget; the markers name the
# tiers of the 5K instance they stand in for, so a test written over the
# declared instances runs the same way at both sizes.
bin:
  - factor: 1
    marker: ci
  - factor: 5
    marker: ci
  - factor: 10
    marker: ci

# Ladders over the K states, shared by every class, and two per-class vectors
# that separate the classes: the negative binomial's mean is scaled and the
# beta-binomial's rate shifted. `rate` and `concentration` give
# alpha = concentration * rate and beta = concentration * (1 - rate).
emissions:
  form: independent
  mean: [30.0, 90.0]
  dispersion: [6.0, 12.0]
  trials: [40.0, 40.0]
  rate: [0.30, 0.65]
  concentration: [25.0, 25.0]
  class_mean_scale: [0.8, 1.3]
  class_rate_shift: [-0.08, 0.10]
