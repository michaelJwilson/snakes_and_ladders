model: spatio-sequential-counts
oracle: transfer-matrix

# The count-pair coupled model under a continuous covariate (issue #1064).
# The model, the seed and the size are `spatio_sequential_counts/ci.yaml`'s,
# so the two instances differ in one thing: here every count is drawn against
# its own exposure and trial count. Every field is required -- see
# python/sal/sim/count_pairs.py.
#
# 8x8 triangular = 64 vertices, M = K = 2, S = 1,000: 64,000 count pairs, each
# with its own log-normal exposure, so the exposure takes 64,000 distinct
# values. That is the regime the tabulated Rust E step was not built for: a
# table indexed by count and distinct covariate value grows with the number
# of observations.
#
# The oracle is the transfer matrix, as in the uncovaried file: given the
# labelling each class's evidence and posterior are the exact forward
# recursion over its chain, scored by the families' own densities at each
# observation's own covariate.
seed: 20260908

# What the counts hash to. Written by `sim.count_pairs.counts_digest` over the
# draw `sim.count_pairs_rust.simulate_count_pairs` makes of this file.
counts_digest: cc6dcf884972d0c8
shape: [8, 8]
boundary: open
coupling: 1.0
n_classes: 2
n_states: 2
n_positions: 1000
beta: 1.0
self_transition: 0.7
initial:
  - [0.6, 0.4]
  - [0.35, 0.65]

# The fine instance alone. Binning sums the exposures over a bin, and a sum
# of negative binomials at unequal exposures is not negative binomial, so a
# binned instance would be a misspecification this file has no use for.
bin:
  - factor: 1
    marker: ci

emissions:
  form: independent
  mean: [30.0, 90.0]
  dispersion: [6.0, 12.0]
  trials: [40.0, 40.0]
  rate: [0.30, 0.65]
  concentration: [25.0, 25.0]
  class_mean_scale: [0.8, 1.3]
  class_rate_shift: [-0.08, 0.10]

# One log-normal draw per position, vertex and channel, from its own seed:
# `median * exp(sigma * z)`. The exposure multiplies the negative binomial's
# mean; sigma = 0.5 puts 95% of it in [0.38, 2.66]. The trial count replaces
# the beta-binomial's 40 and is rounded to a whole number, at least one.
covariate:
  form: lognormal
  seed: 20260925
  exposure:
    median: 1.0
    sigma: 0.5
  trials:
    median: 40.0
    sigma: 0.25
