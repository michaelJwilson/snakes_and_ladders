model: count-pair-hmm
oracle: none

# The seven-state joint count-pair HMM of experiment 030 (issue #1378, Part
# B), declared here since issue #1416; python/sal/sim/count_pair_hmm.py
# states the chain and the draw. Refereed by the generating parameters'
# log-likelihood: nothing enumerates 7^8000 paths.
seed: 1378
n_positions: 8000
# Five states share the dominant total level (98% of positions); two rare
# states sit on their own total levels, 1% each, and share the dominant
# state's success rate, so every pair of states differs in one channel at
# least.
occupancy: [0.90, 0.02, 0.02, 0.02, 0.02, 0.01, 0.01]
mean: [100.0, 100.0, 100.0, 100.0, 100.0, 50.0, 150.0]
rate: [0.5, 0.4, 0.6, 0.3, 0.7, 0.5, 0.5]
# NB dispersion 1 / r = 0.1; BB concentration alpha + beta = 1.2e4.
dispersion: 10.0
concentration: 1.2e4
# Mean dwell of a state other than the first, in positions.
rare_dwell: 50.0

# sim.count_pair_hmm.observations_digest of the drawn chain; the value the
# QA script's in-place construction drew before this file existed.
observations_digest: 0651e2908400ad18
