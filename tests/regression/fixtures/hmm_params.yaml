# Ground truth for the discrete-HMM reference instance
# (tests/regression/opt/test_opt_hmm.py, tests/regression/sim/test_hmm_simulate.py).
# Every field is required -- see python/snakes_and_ladders/sim/hmm.py and sim/CLAUDE.md.
#
# The emission rows are deliberately well separated: a near-uniform emission
# makes the hidden states nearly exchangeable, and a recovery test on an
# almost-unidentifiable model measures the fixture rather than the optimizer.
#
# sequence_length=15 with n_sequences=600 gives 8400 transitions and 9000
# emissions. 600 rather than 300 because at 300 the maximum-likelihood
# estimate lands on the boundary -- an emission probability fitted at zero --
# for some seeds, where the observed information is singular and a Wald
# interval is undefined. Measured eigenvalue ratio of the information at the
# optimum: 9.7e-15 at 300 sequences on one seed, versus a stable ~1e-3 from
# 600 upward.
seed: 20260903
n_states: 3
n_symbols: 4
sequence_length: 15
n_sequences: 600
initial: [0.5, 0.3, 0.2]
transition:
  - [0.70, 0.20, 0.10]
  - [0.15, 0.75, 0.10]
  - [0.20, 0.20, 0.60]
emission:
  - [0.70, 0.15, 0.10, 0.05]
  - [0.05, 0.65, 0.20, 0.10]
  - [0.10, 0.10, 0.25, 0.55]

# Absolute tolerance a sim validation test checks simulated frequencies
# against their exact (enumeration) or analytic (stationary distribution)
# counterpart within. Monte Carlo standard error at 4500 draws (600
# sequences, 1 symbol per sequence at a fixed position) is ~0.007 for a
# probability near 0.3; 0.02 is under three of those.
tolerance: 0.02
