model: jukes-cantor
oracle: none

# The leaf-count ladder, at the rung that runs by default (issue #582).
#
# 20 taxa, and only 20 on a pull request. The other rungs are the same
# instance at a larger leaf count -- 50 behind `-m stress`, 200 behind the
# release gate -- so which one runs is the tier, and the per-PR suite pays
# for one.
#
# **This is a cost fixture, not a difficulty fixture.** Step 1 of #582
# measured neighbour joining recovering the generating topology exactly at
# 8, 20, 50, 100 and 200 leaves -- normalized RF 0.0000, zero variance over
# four seeds -- so leaf count does not make the problem hard and a ladder
# that stops "where the baselines fail" has no rung to stop at. What it does
# do is make the problem *big*, which is what the post-order optimizations of
# this branch are measured on.
#
# `oracle: none` is the statement the registry defines it as, not an
# omission: 20 leaves is 2.2e20 unrooted topologies, so the size is past
# enumeration and the result is refereed by the simulated truth -- the
# generating topology this file declares. Root CLAUDE.md admits that where no
# oracle is affordable at a size, and keeps the oracle ticketed.
#
# tau is declared rather than written out -- see
# python/sal/sim/params.py. The height of 0.25 bounds the
# root-to-tip path at every rung, so the diameter does not grow with the leaf
# count and distant pairs stay inside the Jukes-Cantor saturation of 0.75.
seed: 20260914
n_sites: 2000
tolerance: 0.03
k: 4
pi: [0.25, 0.25, 0.25, 0.25]
tau:
  balanced: 20
  height: 0.25
