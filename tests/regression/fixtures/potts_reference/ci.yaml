model: potts-reference
oracle: none

# The Potts reference cell (issue #1390) at the per-pull-request size: 300
# sites on a periodic triangular lattice, q = 4, J = 1. The construction and
# its draw order are python/sal/sim/potts_cell.py's. No enumeration
# reaches 4**300 labellings, so the stated oracle is none: what referees a
# labelling is the TRW-S lower bound and the planted energy, recorded in
# ci.baseline.json by infra/baselines.py.
seed: 7
shape: [15, 20]
graph: triangular
boundary: periodic
n_states: 4
coupling: 1.0

# One label at 2% of sites, the other three at 1:3:10 --- #1378's shares.
shares: [0.02, 0.07, 0.21, 0.70]

# Top-two margin over J times the mean degree (6 here, so a margin of 3.0);
# the argmax is a wrong label on 30% of sites; every entry carries N(0, 0.25).
margin_ratio: 0.5
mislead: 0.30
jitter: 0.25

# sim.potts_cell.planted_digest of the drawn cell, so a changed
# construction fails at the fixture rather than in a study's numbers.
planted_digest: 8fff478941f60d1d
