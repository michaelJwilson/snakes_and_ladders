model: potts-reference
oracle: none

# The Potts reference cell (issue #1390) at 1e5 sites: 250 x 400 on a
# periodic triangular lattice, q = 4, J = 1, the stress cell's every other
# factor. Read by the n-scaling of profile_hotpaths.py --module anneal.
seed: 7
shape: [250, 400]
graph: triangular
boundary: periodic
n_states: 4
coupling: 1.0

# One label at 2% of sites, the other three at 1:3:10 --- #1378's shares.
shares: [0.02, 0.07, 0.21, 0.70]

# Top-two margin over J times the mean degree (6 here, so a margin of 3.0);
# the argmax is a wrong label on 30% of sites; every entry carries N(0, 0.25).
margin_ratio: 0.5
mislead: 0.30
jitter: 0.25

planted_digest: 45e83dc52d11b3ae
