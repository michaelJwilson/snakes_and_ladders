[package]
name = "oxi_snakes_and_ladders"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/michaelJwilson/snakes_and_ladders"

[lib]
# "rlib" (alongside "cdylib") lets benches/ and tests/ link this crate
# normally as a Rust library; "cdylib" alone is only linkable by Python.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `burn-ndarray` and `burn-autodiff` alone, not the framework: issue #449
# needs reverse-mode autodiff over one recursion and no modules, optimizers,
# training loops or datasets. Dual MIT / Apache-2.0, the pairing `pyo3` and
# `numpy` already carry.
burn-autodiff = { version = "0.18", default-features = false, features = ["std"] }
burn-ndarray = { version = "0.18", default-features = false, features = ["std"] }
burn-tensor = { version = "0.18", default-features = false, features = ["std"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "oxi_snakes_and_ladders_bench"
harness = false
