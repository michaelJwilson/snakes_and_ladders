[package]
name = "oxi_snakes_and_ladders"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/michaelJwilson/snakes_and_ladders"

[lib]
# "rlib" (alongside "cdylib") lets benches/ and tests/ link this crate
# normally as a Rust library; "cdylib" alone is only linkable by Python.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `burn-ndarray`, `burn-autodiff` and `burn-tensor` alone, not the framework:
# issue #449 needed reverse-mode autodiff over one recursion and no modules,
# optimizers, training loops or datasets. Dual MIT / Apache-2.0, the pairing
# `pyo3` and `numpy` already carry. Optional, and reached only through the
# `sandbox` feature below: the route lost its measurement, so the default
# build, the wheel and every per-pull-request job must not pay for it.
burn-autodiff = { version = "0.18", default-features = false, features = ["std"], optional = true }
burn-ndarray = { version = "0.18", default-features = false, features = ["std"], optional = true }
burn-tensor = { version = "0.18", default-features = false, features = ["std"], optional = true }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

[features]
# The declined routes issue #322's sandbox rule conserves, so their
# comparison stays re-runnable: `src/pruning_burn.rs` and the
# `pruning_gradient` binding it registers. Off by default and compiled by
# `infra/release.sh`, which is what keeps a `cfg`-gated route from rotting
# unnoticed.
sandbox = ["dep:burn-autodiff", "dep:burn-ndarray", "dep:burn-tensor"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "oxi_snakes_and_ladders_bench"
harness = false
