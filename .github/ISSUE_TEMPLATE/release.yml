name: Release
description: Consolidate the repository and cut a release.
title: "Release 0.4.0"
labels: ["priority:high", "module:infra"]
body:
  - type: input
    id: version
    attributes:
      label: Target version
      description: >
        The `Cargo.toml` `[package].version` this release cuts, e.g. `0.1.0`
        (CLAUDE.md's Single Version Source).
      value: "0.4.0"
    validations:
      required: true
  - type: textarea
    id: roadmap-progress
    attributes:
      label: Roadmap progress
      value: |
        Summarize progress against `ROADMAP.md` since the last release: which
        milestones moved, and against which requirement.

        Further update the ROADMAP.md if necessary, i.e. if a high-level work milestone
        has been achieved that was not described. An edit here maintains the
        document's existing tone and high-level intent rather than replacing it.
    validations:
      required: true
  - type: textarea
    id: consistency-audit
    attributes:
      label: Consistency audit
      value: |
        Check `CLAUDE.md`, `DEV.md`, `README.md`, `INSTALL.md`, `ROADMAP.md`,
        `docs/tex/` and the code against each other. Record what is stale, contradictory,
        or duplicated (including duplicated machinery/code across modules), and fix it in this
        ticket's PR. Code duplication should be common language.

        Include consistency of the release template and text with respect to recent development.
  - type: checkboxes
    id: preconditions
    attributes:
      label: Preconditions
      description: >
        What must hold before the gate runs; each is checked, not assumed.
      options:
        - label: "`dev` matches `main` plus the open pull requests"
        - label: The tag for the previous release exists
        - label: The applicability tables in the textbook are regenerated (`infra/problems_tables.py --write`)
  - type: textarea
    id: suggested-work
    attributes:
      label: Suggested work
      description: >
        Specific edits this release ticket should make, if any are already known.
        Leave blank if none.
  - type: textarea
    id: follow-up-tickets
    attributes:
      label: Suggest follow-up tickets
      value: |
        In the PR, suggest high-level work or blind spots the audit surfaced, sized to become
        their own task-template tickets to be tracked, rather than folded into this one.
