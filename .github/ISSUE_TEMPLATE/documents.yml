name: Rebuild the documents
description: Rebuild docs/paper.pdf and docs/textbook.pdf from docs/tex/ and commit them.
title: "Rebuild the documents"
labels: ["module:docs", "priority:medium"]
body:
  - type: markdown
    attributes:
      value: |
        Pull requests change `docs/tex/` and never the PDFs, so the committed
        PDFs lag the sources until this ticket's pull request rebuilds them
        (`DEV.md`, Technical Documents). CI refuses a PDF change in any other
        pull request. File this when the lag matters: before a release, or
        when a reader needs the rendered document.
  - type: textarea
    id: since
    attributes:
      label: What changed since the last rebuild
      description: The pull requests to `docs/tex/` since the PDFs were last committed, from `git log --oneline -- docs/tex/ $(git log -1 --format=%H -- docs/textbook.pdf)..HEAD`.
    validations:
      required: true
  - type: checkboxes
    id: documents
    attributes:
      label: Documents
      options:
        - label: "`docs/paper.pdf`"
        - label: "`docs/textbook.pdf`"
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: What the pull request must show.
      value: |
        - Built with `infra/build_technical_doc.sh` on `main`, nothing edited by hand.
        - The pull request's title contains "Rebuild the documents" and it changes only the two PDFs and `docs/tex/figures/`.
        - `latexmk`'s logs report no undefined or multiply-defined reference or citation (CI checks this on every pull request).
        - The build's wall clock and host in the pull request body.
    validations:
      required: true
