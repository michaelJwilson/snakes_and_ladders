name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # The audit job below skips when the dependency graph is unchanged, but
    # advisories are disclosed against dependencies that never change. This
    # weekly run audits main regardless, so a new advisory surfaces without
    # waiting for someone to touch a lockfile.
    - cron: "17 6 * * 1"

# Pushing again to a branch cancels that branch's previous run rather than
# paying for both. `main` is excluded: its runs record the state of the
# default branch and populate the audit caches PRs restore from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Pinned runner image and a pinned uv keep CI reproducible; the Rust toolchain
# is pinned by rust-toolchain.toml and the dependency graphs by uv.lock and
# Cargo.lock. `--locked` on every install fails the build if a lockfile is
# stale rather than silently resolving something new.
env:
  UV_VERSION: "0.8.17"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  lint:
    name: Lint & type-check (ruff, mypy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # towncrier check below diffs against origin/main; a shallow
          # checkout wouldn't have that history to compute a merge-base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: pip install "uv==${UV_VERSION}"
      # The test extra is needed as well as dev: mypy is configured to check
      # tests/, which imports numpy and pytest, and strict mode fails on an
      # unresolvable import rather than ignoring it.
      - run: uv sync --locked --extra dev --extra test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Fails a PR that changes user-visible behavior without a matching
      # changelog.d/ fragment; no-ops on push to main (no diff against itself).
      - run: uv run towncrier check --compare-with origin/main

  rust-lint:
    name: Rust lint & format (clippy, fmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  rust-tests:
    name: Rust tests (cargo test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: cargo test --locked
      - name: Rust benchmark (informational, not gated)
        run: cargo bench --locked

  build:
    name: Python/Rust build (maturin)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      # Deliberately plain pip, not the lockfile: this job checks the path a
      # fresh consumer takes when installing the package from source.
      - run: pip install .
      - name: Smoke-test snakes_and_ladders.oxi_snakes_and_ladders is importable
        run: python -c "from snakes_and_ladders.oxi_snakes_and_ladders import double; assert double(21) == 42"

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The benchmark decision below diffs against the base branch, which
          # a shallow checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra test
      # Benchmarks are half the suite's wall clock (36 s of 71 s) and measure
      # code that a docs or QA change cannot have altered, so they are skipped
      # unless something they measure moved. The job still runs and still
      # reports, because it is a required check: skipping the *step* would
      # leave the check pending and block the merge (issue #109).
      #
      # Coverage is unaffected: every line the benchmarks reach is also
      # reached by the regression module DEV.md's Test Layout requires each of
      # them to pair with, so the suite stays at 100% either way.
      # `infra/select_tests.py` turns the changed files into the test paths to
      # run and the modules to measure coverage over (issue #161). It derives
      # dependents from the import graph -- a change to `likelihood` runs
      # `search`, which imports it -- and answers "everything" for any change
      # it cannot attribute to one module: a lockfile, a shared fixture, this
      # workflow. The unsafe answer is the one that looks like a saving.
      #
      # Nothing is selected when the diff changed no code, because the suite
      # would then run the same tests over the same source as the last run on
      # main. The job still runs and still reports: skipping the *step* rather
      # than the job is what keeps a required check from sitting pending and
      # blocking the merge (issue #109).
      - name: Decide which tests the change needs
        id: selection
        run: |
          # Selection is a pull-request optimisation only. On a push to main
          # the whole suite runs with package-wide coverage, which is what
          # stops a module no pull request selected from rotting unnoticed --
          # the other half of the trade, per DEV.md. `infra/release.sh` does
          # the same at release.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::notice::not a pull request -- running the whole suite"
            echo "paths=tests" >> "$GITHUB_OUTPUT"
            echo "cov=--cov=snakes_and_ladders" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          echo "$changed" | python3 infra/select_tests.py >> "$GITHUB_OUTPUT"
          echo "$changed" | python3 infra/select_tests.py | sed 's/^/::notice::/'
      - name: Run the selected tests
        run: |
          paths="${{ steps.selection.outputs.paths }}"
          cov="${{ steps.selection.outputs.cov }}"
          if [ -z "$paths" ]; then
            echo "::notice::no code changed -- the suite would repeat main's last run"
            exit 0
          fi
          # The gate is 90% of what was selected. Where everything is
          # selected that is the package, as before; where a subset is, the
          # claim is that each touched module is covered by its own tests.
          # DEV.md states the difference.
          uv run pytest -m "not release" $paths \
            $cov --cov-report=term-missing --cov-fail-under=90

  docs:
    name: Docs build (Sphinx)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra docs
      - run: uv run sphinx-build -b html docs/source docs/_build/html -W

  notebooks:
    name: Notebooks (re-execute docs/nb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra notebooks
      # Runs every notebook and diffs what it printed against what is
      # committed. Measured at 92 s for the three, so it is its own job
      # rather than release-gated: a notebook that stopped running would
      # otherwise reach main and sit there until a release.
      - run: uv run python infra/check_notebooks.py

  technical-doc:
    name: Technical document (LaTeX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Cache Cargo registry and the oxi_snakes_and_ladders build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --locked --extra test
      # TeX Live from the Ubuntu archive rather than a third-party action:
      # these packages are what the document needs (poppler-utils is for the
      # staleness check below), and no new GitHub Action joins the supply
      # chain.
      # The .deb files, not the installed tree: apt's cache is what can be
      # restored safely, and dpkg still installs from it in a second or two.
      # `uv` and Cargo are both cached above; this was the one install left
      # paying full price on every run (issue #154).
      - name: Cache the TeX Live packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: texlive-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            texlive-${{ runner.os }}-
      - name: Install TeX Live
        run: |
          # Keep the downloaded .debs so the cache above has something to save.
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99keep-debs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-science \
            poppler-utils
      # Regenerates the QA figures/captions the documents cite, then builds
      # docs/paper.pdf and docs/textbook.pdf -- the same entry point a local
      # build uses (see infra/CLAUDE.md), so CI and a contributor's machine
      # take one path.
      - name: Build the documents (QA figures + PDFs)
        run: infra/build_technical_doc.sh
      # latexmk exits 0 on unresolved references and citations, so the log is
      # checked explicitly -- the LaTeX counterpart of the docs job's -W.
      # Both logs, since a reference broken by the split would otherwise be
      # caught in whichever document happened to be checked (issue #249).
      - name: Fail on undefined or duplicated references and citations
        run: |
          # "multiply defined" matters as much as "undefined": two equations
          # sharing a label make every \eqref to it point at whichever came
          # last, silently. A duplicate went unnoticed until it was found by
          # hand, which is what added it to this pattern.
          for document in paper textbook; do
            if grep -nE 'There were undefined references|Citation .* undefined|Reference .* undefined|multiply defined' "docs/$document.log"; then
              echo "::error::LaTeX reported undefined or multiply-defined references or citations in $document"
              exit 1
            fi
          done
      # Both PDFs are committed (see DEV.md's "Technical Documents"
      # section); catch a PR that edited docs/tex/ or a QA figure without
      # regenerating and committing the rebuilt PDFs. SOURCE_DATE_EPOCH (set
      # in infra/build_technical_doc.sh) makes a rebuild byte-identical to
      # itself on one machine, but pdftex's font-subsetting order can still
      # differ across otherwise-identical TeX Live installs (e.g. this
      # runner vs. a contributor's machine), producing a different-but
      # visually-equivalent PDF. Rasterizing both to PNG and comparing those
      # bytes checks the document's actual rendered content instead of the
      # PDF container's internal encoding.
      - name: Check the committed PDFs are up to date
        run: |
          for document in paper textbook; do
            rm -rf /tmp/committed-pages /tmp/built-pages
            mkdir -p /tmp/committed-pages /tmp/built-pages
            git show "HEAD:docs/$document.pdf" > /tmp/committed.pdf
            pdftoppm -png -r 150 /tmp/committed.pdf /tmp/committed-pages/page
            pdftoppm -png -r 150 "docs/$document.pdf" /tmp/built-pages/page
            committed_hash="$(cat /tmp/committed-pages/page*.png | sha256sum | cut -d' ' -f1)"
            built_hash="$(cat /tmp/built-pages/page*.png | sha256sum | cut -d' ' -f1)"
            if [ "$committed_hash" != "$built_hash" ]; then
              echo "::error::docs/$document.pdf is stale -- run infra/build_technical_doc.sh and commit the result"
              exit 1
            fi
          done

  audit:
    name: Dependency audit (pip-audit, cargo audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      # What an audit examines is fixed by the two lockfiles, so their hash
      # decides whether one is needed. A restored marker means this exact
      # dependency graph already passed, and every step below is skipped. The
      # ISO week in the key rotates it, so an unchanged graph is still
      # re-checked against a freshly fetched advisory database each week.
      - name: Stamp the ISO week
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Look for an earlier audit of this dependency graph
        id: audited
        uses: actions/cache@v4
        with:
          path: .audited
          key: audited-${{ steps.week.outputs.stamp }}-${{ hashFiles('uv.lock', 'Cargo.lock') }}

      - name: Install uv
        if: steps.audited.outputs.cache-hit != 'true'
        run: pip install "uv==${UV_VERSION}"
      - name: Install the dev extra
        if: steps.audited.outputs.cache-hit != 'true'
        run: uv sync --locked --extra dev
      - name: Audit Python dependencies
        if: steps.audited.outputs.cache-hit != 'true'
        run: uv run pip-audit

      # Building cargo-audit costs about four minutes, so the binary is cached
      # against the version pinned above: only the first run after a version
      # bump pays for it.
      - name: Restore cargo-audit
        if: steps.audited.outputs.cache-hit != 'true'
        id: cargo_audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-ubuntu-24.04
      # `--locked` builds cargo-audit from its own lockfile. Without it the
      # resolve floats, and a transitive dependency that raises its minimum
      # rustc past the version rust-toolchain.toml pins breaks the job --
      # which is what happened with kstring 2.0.4 requiring rustc 1.96.0.
      - name: Install cargo-audit
        if: steps.audited.outputs.cache-hit != 'true' && steps.cargo_audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "${CARGO_AUDIT_VERSION}"
      - name: Audit Rust dependencies
        if: steps.audited.outputs.cache-hit != 'true'
        run: cargo audit

      # Written only after both audits pass, and saved by actions/cache when
      # the job succeeds -- so a failed audit records nothing and the next run
      # repeats it.
      - name: Record that this dependency graph passed
        if: steps.audited.outputs.cache-hit != 'true'
        run: date -u > .audited
