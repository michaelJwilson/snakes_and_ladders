# When each method family wins on each problem, and when it does not (issue #376).
#
# Hand-written and committed; the only hand-written input to
# `infra/problems_tables.py`, which reads the tier and the referee of every
# pairing from the suite and takes only this sentence from here. A note that
# cites an experiment must name a file that exists under `docs/experiments/`,
# and `tests/regression/docs/test_problems_tables.py` checks that; a note that
# cites none is a statement about the method's regime, not a measurement, and
# says so in its own words.
#
# One entry per problem, keyed by its row in `PROBLEMS.md`, then by method
# family. A pairing the suite finds and this file does not name fails the
# generation, so the table cannot go quiet about a method that exists.

"Phylogenetic tree, Jukes–Cantor":
  initializers: >-
    Ties the objective's own start at five and six taxa, every start
    converging in 22 to 27 evaluations (experiment 006); the joining start is
    the only one available past the enumerable taxon count, where nothing
    referees it.
  samplers: >-
    Annealing over topologies returns the flat-prior weight over maximized
    likelihoods, which hill climbing cannot; it pays a full branch-length fit
    per step, so it loses wherever only the optimum is wanted.
  optimizers: >-
    Hill climbing reaches the enumerated optimum from 12 of 12 starts at six
    taxa; the learned policy ties it over one feature and wins over seven
    (experiment 005), while random restarts reach 1.000 at the same budget.
  surrogates: >-
    A surrogate-ranked neighbourhood reaches its optimum at 5 fits against
    312, and changes only what is fitted; it wins nothing where the
    neighbourhood is small enough to fit exhaustively.

"Phylogenetic tree, general time-reversible":
  initializers: >-
    The log-det distance is additive under any Markov process, so it starts a
    fit the Jukes--Cantor distance cannot; no test of either significant kind
    names it as a start, which is why the pairing reads untested.
  optimizers: >-
    The same quasi-Newton fit over a longer parameter vector, refereed by the
    same brute-force marginalization; it recovers the rate matrix where the
    alignment identifies it and refuses an interval where it does not.

"Phylogenetic tree, parsimony":
  optimizers: >-
    One post-order pass per candidate rather than one optimization, so an
    equal budget reaches a neighbourhood an order of magnitude larger; it
    climbs the wrong criterion in the Felsenstein zone.

"Potts chain in a field":
  optimizers: >-
    The transfer matrix makes the chain's normalizer exact at every length, so
    the gradient fit is refereed wherever it runs; nothing here separates it
    from enumeration, which is also exact at these sizes.
  surrogates: >-
    The relaxation is exact at every corner to 1e-11 and supplies a gradient
    the discrete objective has not; it buys nothing at a size enumeration
    reaches, and the learned policy beats greedy on the same landscape
    (experiment 003).

"Potts lattice and Markov random field":
  samplers: >-
    Cluster moves slow by 1.9$\times$ between extent 8 and 24 where single-site
    sweeps slow by 3.2$\times$, a gap of 2.1$\times$ and widening (experiment 001); they
    refuse a negative coupling, where the single-site sweep is all there is.
  optimizers: >-
    The minimum cut is exact and polynomial where the couplings are
    submodular; above two states only alpha expansion applies, with a
    factor-of-two bound rather than an optimum, and Max-Cut is bounded and
    never solved.
  surrogates: >-
    Belief propagation is exact on a tree and the Bethe approximation
    otherwise, so it stands in for the normalizer at sizes enumeration cannot
    reach; on a loopy graph its error is reported and asserted against
    nothing.

"Frustrated Potts: triangular antiferromagnet, planted spin glass":
  samplers: >-
    No sampler of its own: the lattice's samplers apply unchanged, and the
    cluster moves refuse the negative couplings these instances are built
    from. What the row adds is the ground-state energy every search is scored
    against.
  optimizers: >-
    No optimizer of its own. The exact cut refuses a non-submodular energy, so
    these instances are where descent, annealing and tempering are separated
    at an equal budget of sweeps and nothing is solved exactly.

"Planted spin glass, enumerable ground state":
  samplers: >-
    Annealing is the sampler that separates from descent here, and the reason
    the instance is declared: single-site descent reaches the enumerated
    ground state from 0.079 of starts, so a sampler that escapes a local
    minimum has something to win against and an exact answer to win it
    against.
  optimizers: >-
    Descent is the baseline the instance defeats. The sizes are chosen so the
    ground state is enumerated rather than bounded, which is what lets a
    failure be a failure rather than an unknown.

"Low-density parity-check code, Gallager (3,6)":
  optimizers: >-
    Sum-product decodes to the bitwise posterior and min-sum to the most
    probable codeword; both are exact on a cycle-free code and the Bethe
    approximation on a loopy one, where min-sum is the cheaper and the weaker
    and the gap is measured.

"Turbo code, two (7,5) recursive systematic encoders":
  optimizers: >-
    BCJR is exact on one constituent code, since a terminated trellis is a
    chain, and Viterbi over the same branch metrics returns the most likely
    message rather than the most likely bits --- two answers, and a received
    word separates them. The pair is loopy sum-product on a serial schedule
    and is exact nowhere: at K = 12 its bit error rate is 1.26 to 3.20 times
    the enumerated bitwise MAP's, and it is not monotone in the iteration
    count, every rise lying inside one binomial interval of the sample. The
    iteration wins where the interleaver is long: at K = 256 it is under the
    uncoded closed form at every declared point and at K = 1,024 the curve
    turns between 0.4 and 1.2 dB.

"Hidden Markov model, six emission families":
  samplers: >-
    The block sweep draws a whole path from its conditional in one pass, where
    a single-site sweep would move one position at a time against the chain;
    over eight positions its draws agree with the enumerated path posterior
    site by site to 0.0146 and jointly over the lumped cells.
  optimizers: >-
    Expectation--maximization re-estimates in closed form for every family
    whose M step has one and wins on cost there; the gradient fit is the only
    route where it does not, and the two must reach the same optimum. Interval
    coverage is nominal from two standard deviations of separation upward
    (experiment 002).
  surrogates: >-
    The relaxation of the state path is exact at every corner and gives a
    gradient over paths; it says nothing at a length past which the path
    enumeration that referees it cannot run.

"Coupled spatio-sequential model":
  initializers: >-
    The annealed data-sampled burn-in beats a uniform start at an equal budget
    on the planted lattice, where it is the start and not the move that
    decides the labelling; it returns the enumerated maximum-posterior
    labelling on 9 of 12 instances and is within 1.05 nats on the rest.
  samplers: >-
    The factor-graph sweep is one algorithm over the whole coupled graph and
    is refereed by enumeration on the canonical instance; it is slower per
    sweep than the specialized Potts kernel it generalizes.
  optimizers: >-
    Block-coordinate ascent does not decrease the joint at any block, for
    every label solver; iterated conditional modes freezes into disjoint
    clusters where the cluster move does not, and which wins is measured at an
    equal budget rather than assumed.

"Count-pair coupled spatio-sequential model":
  optimizers: >-
    Block-coordinate ascent recovers the planted labelling at every declared
    bin factor on the 5,041-vertex instance, where the E step is the Rust
    kernel and the label block is alpha-expansion on its field; what it is
    refereed by at that size is the planted labelling alone, since no exact
    evidence reaches 5,041 vertices.

"Gaussian mixture":
  initializers: >-
    The seeding cost is within the published factor of the exact clustering
    cost, and on the enumerable instance the seeded start lands in the
    maximum-posterior assignment over all 65,536 on 20 of 20 seeds where
    uniform seeding lands in it on 10; what it buys past the basin is
    nothing, since expectation--maximization reaches the same optimum from
    either start.
  optimizers: >-
    Restarts reach the best-known optimum from 7 of 40 starts against
    tempering's 4 and annealing's 1 at 3,000 evaluations (experiment 004);
    where components overlap the fixed point is approached linearly, so an
    iterate stopped at a count needs a polish.

"Mixture of two-channel count emissions":
  initializers: >-
    A component is placed on an observed pair rather than on a coordinate, so
    the seeding has a distance where a squared one would compare a depth with
    an allele count; against a uniform start on shared seeds the two reach the
    same optimum at the three-component instance and differ at ten, and the
    comparison is reported whichever way it falls rather than asserted in a
    direction.
  optimizers: >-
    Expectation-maximization through the family's own M step, which is a
    bracketed solve per component rather than a formula, so the cost and the
    difficulty both scale with the component count: one seeded run recovers
    every planted parameter at three components and seven of ten components at
    ten, in 121 s, which is what makes the larger instance a hard case rather
    than a bigger one.

"Continuous test functions":
  initializers: >-
    Multi-start is what makes Himmelblau's four basins reachable at all; on a
    unimodal surface it spends the budget for nothing. Every fit from every
    restart lands within 6.2e-07 of one of the four published minimizers, so
    the closed form referees where in a basin the fit stopped and not only
    which basin it found.
  samplers: >-
    The annealed Hamiltonian chain with a polishing fit is beaten by plain
    restarts on the mixture at 3,000 evaluations (experiment 004); on
    Rastrigin it is the only method that crosses the ripple, and which wins is
    a property of the surface.
  optimizers: >-
    The quasi-Newton fit reaches the analytic minimizer in every dimension
    tried on Rosenbrock; on Rastrigin the fraction of starts reaching the
    global minimum is asserted low, which bounds what one fit of a multimodal
    surface may claim.

# Why a pairing the catalogue carries is not run on that problem's declared
# instance (issue #382). `infra/problems_tables.py --check` lists the pairs and
# `tests/regression/docs/test_problems_tables.py` holds this block to that
# list, so a pairing loses its reason only by gaining a test.
untested pairings:
  ldpc / optimizers: >-
    The decoder's claim is about the (3,6) ensemble, so the tests draw codes
    at several block lengths and seeds rather than decoding one member. The
    declared members are what the notebook decodes.
  mixture / initializers: >-
    Seeding is refereed against the exact optimal k-means cost over a range of
    sample sizes; the declared instance is the one the seeding figure and
    experiment 004 measure.
  mixture / optimizers: >-
    Expectation-maximization is pinned against the gradient fit on mixtures
    built per test, where the two are given the same observations at several
    sizes; the declared instance carries the comparison at the release budget.
  planted_glass / optimizers: >-
    Descent is measured on the declared instance and the ground state is
    enumerated, but the annealer and the exact cut are not: the cut refuses a
    non-submodular energy and the annealer's own claims are pinned on the
    lattice, at sizes chosen for the sampler rather than for this instance.
  planted_glass / samplers: >-
    The instance exists to defeat descent, and what it is pinned against is
    descent. Separating a sampler from descent on it is the comparison it was
    declared for and is not yet run.
  potts_lattice / surrogates: >-
    The relaxation is refereed against enumerated maximum cuts, which fixes
    the size at what enumeration reaches rather than at the declared one.
  spatio_sequential_counts / optimizers: >-
    The 5,041-vertex instance's fit runs at the key and stress budgets rather
    than per pull request, so no test of either significant kind names the
    declared fixture inside the tier this table reads; the ci instance is what
    the E step and the binning are pinned on.
  test_functions / initializers: >-
    Random restarts are measured on functions constructed at the dimensions
    and starts each property needs, including ones chosen to be hard; the
    declared instances are the two-dimensional ones the landscape figure draws.
  test_functions / samplers: >-
    Annealing is refereed against the closed-form minimizers on the surfaces
    where a basin is unambiguous, which the tests construct.
  test_functions / optimizers: >-
    The fit is pinned to the analytic minimizers and to an independently
    written L-BFGS, both on functions the tests construct.
  tree_jc / initializers: >-
    The distance and spectral starts are exercised on the search fixtures,
    where a topology can be enumerated; these alignments referee the simulator
    and the likelihood.
  tree_jc / optimizers: >-
    The model fit and the parsimony search run on the search fixtures for the
    same reason; what these alignments referee is the simulator and the
    evaluators.
